<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客語橫式生字練習簿產生器 | Hakka Copybook</title>
    <!-- 引入臺灣教育部客語/台語推薦硬筆手寫字型：芫荽體 (Iansui) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-iansui@1.0.0/dist/iansui.min.css">
    <style>
        :root {
            --primary: #1b4965;
            --primary-hover: #13354a;
            --accent: #d4a373;
            --bg-ui: #f4f6f8;
            --panel-bg: #ffffff;
            --border-color: #cbd5e1;
            --grid-line-color: #e63946;
            --grid-dash-color: #f4a261;
            --pinyin-line-color: #457b9d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif;
            background-color: var(--bg-ui);
            color: #2b2d42;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 側邊控制面板 */
        #control-panel {
            width: 380px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 12px rgba(0,0,0,0.06);
            z-index: 10;
        }

        .panel-header {
            padding: 20px;
            background: var(--primary);
            color: #fff;
        }

        .panel-header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-header p {
            font-size: 0.8rem;
            color: #e0f2fe;
            margin-top: 4px;
        }

        .panel-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
        }

        .form-group textarea, 
        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group textarea:focus, 
        .form-group input:focus, 
        .form-group select:focus {
            border-color: var(--primary);
        }

        .form-group textarea {
            height: 100px;
            resize: vertical;
            line-height: 1.4;
        }

        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .panel-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border-color);
            background: #fff;
        }

        .btn-print {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-print:hover {
            background: var(--primary-hover);
        }

        /* 預覽視窗區塊 */
        #preview-area {
            flex: 1;
            overflow: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #525659;
            gap: 30px;
        }

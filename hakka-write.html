<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>臺灣客家語文習字簿產生器 (A4橫式)</title>
  <!-- Google Fonts: 備用英數與襯線字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Charis+SIL:ital,wght@0,400;0,700;1,400&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* 引入字體資料夾的芫荽體 */
    @font-face {
      font-family: 'Iansui';
      src: url('./fonts/Iansui-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    /* 引入字體資料夾的臺灣楷體 */
    @font-face {
      font-family: 'TaiwanKaiti';
      src: url('./fonts/Taiwan-Kaiti.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    /* 引入字體資料夾的辰宇落雁體 */
    @font-face {
      font-family: 'ChenYuluoyan';
      src: url('./fonts/ChenYuluoyan.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    /* 莫蘭迪霧霾藍柔和背景 */
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #eef3f6;
      color: #2c3842;
    }

    /* 漢字字體選項 */
    .font-twkai {
      font-family: 'TaiwanKaiti', 'Iansui', 'DFKai-SB', 'BiauKai', '標楷體', cursive, serif;
    }
    .font-iansuikai {
      font-family: 'Iansui', 'TaiwanKaiti', 'DFKai-SB', 'BiauKai', '標楷體', cursive, serif;
    }
    .font-handwrite {
      font-family: 'ChenYuluoyan', 'Iansui', 'TaiwanKaiti', serif;
    }
    .font-sans {
      font-family: 'Noto Sans TC', sans-serif;
    }

    /* 客語拼音字體：固定為使用臺灣楷體 */
    .font-pinyin {
      font-family: 'TaiwanKaiti', 'Charis SIL', 'DFKai-SB', 'BiauKai', '標楷體', sans-serif !important;
    }

    /* 固定 A4 橫式 (Landscape) 規格: 297mm x 210mm */
    .page-a4-landscape {
      width: 297mm;
      min-height: 210mm;
      height: 210mm;
      max-height: 210mm;
      padding: 8mm 12mm 6mm 12mm;
      margin: 0 auto;
      background: white;
      box-shadow: 0 10px 28px -5px rgba(36, 47, 61, 0.09), 0 8px 12px -6px rgba(36, 47, 61, 0.04);
      position: relative;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      page-break-after: always;
      break-after: page;
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* 列印最佳化：精準隱藏上方導覽與控制項，保留 A4 頁首與頁尾，徹底消除多餘空白頁 */
    @media print {
      header.no-print, 
      aside.no-print, 
      div.no-print {
        display: none !important;
      }

      html, body {
        background: transparent !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        height: auto !important;
        min-height: 0 !important;
        display: block !important;
        overflow: visible !important;
      }

      body > div.flex-1 {
        display: block !important;
        padding: 0 !important;
        margin: 0 !important;
        max-width: none !important;
        width: 100% !important;
        height: auto !important;
        overflow: visible !important;
      }

      .print-area {
        display: block !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: auto !important;
        overflow: visible !important;
      }

      #pages-viewport,
      #pages-container {
        display: block !important;
        width: 100% !important;
        height: auto !important;
        overflow: visible !important;
        gap: 0 !important;
        padding: 0 !important;
        transform: none !important;
        zoom: 1 !important;
      }

      .page-a4-landscape {
        box-shadow: none !important;
        margin: 0 auto !important;
        width: 297mm !important;
        height: 204mm !important;
        max-height: 204mm !important;
        padding: 6mm 10mm 4mm 10mm !important;
        box-sizing: border-box !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        page-break-after: always !important;
        break-after: page !important;
        transform: none !important;
        zoom: 1 !important;
      }

      .page-a4-landscape:last-child {
        page-break-after: auto !important;
        break-after: auto !important;
      }

      @page {
        size: A4 landscape;
        margin: 0;
      }
    }

    .grid-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* 極簡滾動條：絕無上下箭頭、靜止時隱藏、捲動或懸停時淡入、頭尾內縮 8px 藏入圓角 */
    .custom-scroll::-webkit-scrollbar,
    textarea.custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
      background-color: transparent;
    }
    
    .custom-scroll::-webkit-scrollbar-track,
    textarea.custom-scroll::-webkit-scrollbar-track {
      background-color: transparent;
      margin: 8px 0;
    }

    .custom-scroll::-webkit-scrollbar-thumb,
    textarea.custom-scroll::-webkit-scrollbar-thumb {
      background-color: transparent;
      border-radius: 9999px;
      transition: background-color 0.3s ease;
    }

    .custom-scroll:hover::-webkit-scrollbar-thumb,
    .custom-scroll.is-scrolling::-webkit-scrollbar-thumb,
    textarea.custom-scroll:hover::-webkit-scrollbar-thumb,
    textarea.custom-scroll.is-scrolling::-webkit-scrollbar-thumb {
      background-color: #b5c7d5;
    }

    .custom-scroll::-webkit-scrollbar-thumb:hover,
    textarea.custom-scroll::-webkit-scrollbar-thumb:hover {
      background-color: #8fa7bc;
    }

    .custom-scroll::-webkit-scrollbar-button,
    textarea.custom-scroll::-webkit-scrollbar-button {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-between">

  <!-- 頂部導航：莫蘭迪暗夜靛灰藍 -->
  <header class="no-print bg-[#242f3d] text-[#e3e9ee] shadow-sm border-b border-[#344254] shrink-0 z-20">
    <div class="max-w-[1750px] mx-auto px-5 py-3 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center space-x-3.5">
        <div class="w-9 h-9 rounded-lg bg-[#4a6b82] flex items-center justify-center text-white font-bold text-lg shadow-sm">
          <i class="fa-solid fa-pen-fancy"></i>
        </div>
        <div>
          <h1 class="text-base font-semibold tracking-wider flex items-center gap-2.5 text-[#f0f4f8]">
            客家語文生字簿產生器
            <span class="text-xs bg-[#36495b] text-[#c9dbe7] px-2 py-0.5 rounded font-normal">A4 橫向專用版</span>
          </h1>
          <p class="text-xs text-[#95a8b8]">專為臺灣客語設計，拼音調號固定使用臺灣楷體</p>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <button id="btn-print" class="px-5 py-2 bg-[#4a6b82] hover:bg-[#3d5a6f] active:scale-95 text-white rounded-lg text-sm font-medium transition shadow-sm flex items-center gap-2">
          <i class="fa-solid fa-print"></i> 列印 / 另存 A4 橫式 PDF
        </button>
      </div>
    </div>
  </header>

  <!-- 主操作介面：左右雙軌獨立捲動佈局 -->
  <div class="flex-1 flex flex-col xl:flex-row max-w-[1750px] w-full mx-auto p-4 gap-5 items-stretch overflow-hidden">
    
    <!-- 左側控制設定：獨立捲動 -->
    <aside class="no-print custom-scroll w-full xl:w-[460px] bg-white rounded-2xl shadow-sm border border-[#dce5ed] p-5 shrink-0 flex flex-col gap-4 h-full overflow-y-auto">

      <!-- 練習排版模式 -->
      <div>
        <label class="block text-xs font-semibold text-[#4e6070] mb-1.5 uppercase tracking-wider">
          <i class="fa-solid fa-list-check text-[#4a6b82] mr-1.5"></i> 練習模式
        </label>
        <select id="practice-mode" class="w-full border border-[#cedbe6] rounded-lg p-2 text-xs text-[#2c3842] focus:ring-2 focus:ring-[#7b9ab4] focus:border-[#7b9ab4] focus:outline-none bg-white">
          <option value="word_repeat" selected>詞語循環書寫練習</option>
          <option value="first_trace_blank">首字/詞深色示範 + 後續淺灰描紅與空格習字</option>
          <option value="full_trace">全列淺色描紅</option>
          <option value="straight_text">連續書寫模式</option>
          <option value="blank_sheet">純空白練習格</option>
        </select>
      </div>

      <!-- 快速範本 -->
      <div>
        <label class="block text-xs font-semibold text-[#4e6070] mb-2 uppercase tracking-wider">
          <i class="fa-solid fa-bookmark text-[#4a6b82] mr-1.5"></i> 客語常用範本快速載入
        </label>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <button type="button" class="preset-btn p-2.5 rounded-xl border border-[#dfe7ee] hover:border-[#7a9bb5] hover:bg-[#f3f7fa] text-left transition group"
            data-title="日常問候語"
            data-hanzi="恁仔細&#10;承蒙你&#10;食飽吂&#10;正來尞"
            data-pinyin="anˋ ziiˋ se&#10;siinˇ mungˇ ngˇ&#10;siid bauˋ mangˇ&#10;zang loiˇ liau">
            <span class="font-semibold text-[#2b3a47] group-hover:text-[#3e5f78] block">日常問候語</span>
            <span class="text-[#718596] text-[11px]">恁仔細、承蒙你、食飽吂</span>
          </button>

          <button type="button" class="preset-btn p-2.5 rounded-xl border border-[#dfe7ee] hover:border-[#7a9bb5] hover:bg-[#f3f7fa] text-left transition group"
            data-title="童謠《月光光》"
            data-hanzi="月光光&#10;秀才郎&#10;騎白馬&#10;過蓮塘&#10;蓮塘背&#10;種韭菜&#10;韭菜花&#10;結親家&#10;親家門前一口塘&#10;畜个鯉嫲八尺長&#10;長个拿來煮酒食&#10;短个留來討餔娘"
            data-pinyin="ngied gongˊ gongˊ&#10;xiu coiˇ longˇ&#10;kiˇ pag maˊ&#10;go lienˇ tongˇ&#10;lienˇ tongˇ boi&#10;zung giuˋ coi&#10;giuˋ coi faˊ&#10;giedˋ qinˊ gaˊ&#10;qinˊ gaˊ munˇ qienˇ idˋ heuˋ tongˇ&#10;hiugˋ ge liˊ maˇ badˋ cagˋ congˇ&#10;congˇ ge naˊ loiˇ zuˋ jiuˋ siid&#10;donˋ ge liuˇ loiˇ toˋ buˊ ngiongˇ">
            <span class="font-semibold text-[#2b3a47] group-hover:text-[#3e5f78] block">童謠《月光光》</span>
            <span class="text-[#718596] text-[11px]">月光光，秀才郎、</span>
          </button>

          <button type="button" class="preset-btn p-2.5 rounded-xl border border-[#dfe7ee] hover:border-[#7a9bb5] hover:bg-[#f3f7fa] text-left transition group"
            data-title="家庭親屬稱謂"
            data-hanzi="阿爸 阿姆&#10;阿公 阿婆&#10;阿哥 阿姊&#10;老弟 老妹"
            data-pinyin="aˊ baˊ aˊ meˊ&#10;aˊ gungˊ aˊ poˇ&#10;aˊ goˊ aˊ jiˋ&#10;loˋ taiˊ loˋ moi">
            <span class="font-semibold text-[#2b3a47] group-hover:text-[#3e5f78] block">家庭親屬稱謂</span>
            <span class="text-[#718596] text-[11px]">阿公阿婆、阿爸阿姆</span>
          </button>

          <button type="button" class="preset-btn p-2.5 rounded-xl border border-[#dfe7ee] hover:border-[#7a9bb5] hover:bg-[#f3f7fa] text-left transition group"
            data-title="數字"
            data-hanzi="零&#10;一&#10;二&#10;三&#10;四&#10;五&#10;六&#10;七&#10;八&#10;九&#10;十&#10;百&#10;千&#10;萬&#10;億&#10;兆"
            data-pinyin="langˇ&#10;idˋ&#10;ngi&#10;samˊ&#10;xi&#10;ngˋ&#10;liugˋ&#10;qidˋ&#10;badˋ&#10;giuˋ&#10;siib&#10;bagˋ&#10;qienˊ&#10;van&#10;i&#10;seu">
            <span class="font-semibold text-[#2b3a47] group-hover:text-[#3e5f78] block">數字</span>
            <span class="text-[#718596] text-[11px]">個十百千萬億兆</span>
          </button>
        </div>
      </div>

      <!-- 三欄式文字輸入區塊：套用極簡滾動樣式且保留自由調整長度 (resize-y) -->
      <div class="space-y-3 bg-[#f5f8fa] p-3.5 rounded-xl border border-[#dbe4eb]">
        <div class="flex justify-between items-center">
          <label class="text-xs font-semibold text-[#3b4c5c] uppercase tracking-wider flex items-center gap-1.5">
            <i class="fa-solid fa-table-columns text-[#4a6b82]"></i> 三欄式文字與拼音對齊
          </label>
          <span class="text-[10px] text-[#7d90a1]">換行自動對應行數</span>
        </div>

        <!-- 欄位 1：客語漢字 -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs font-medium text-[#3b4c5c]">第一欄：客語漢字 (每行一個詞或句子)</span>
          </div>
          <textarea id="col-hanzi" rows="3" class="custom-scroll w-full text-[#283540] border border-[#cedbe6] rounded-lg p-2 text-xs focus:ring-2 focus:ring-[#7b9ab4] focus:border-[#7b9ab4] focus:outline-none transition resize-y font-twkai leading-relaxed bg-white" placeholder="請直接輸入客語漢字，每行一句">恁仔細
承蒙你
食飽吂
正來尞</textarea>
        </div>

        <!-- 欄位 2：客語拼音（空格分隔） -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs font-medium text-[#3b4c5c]">第二欄：客語拼音 (以空白分開每個字的音)</span>
          </div>
          <textarea id="col-pinyin" rows="3" class="custom-scroll w-full text-[#283540] border border-[#cedbe6] rounded-lg p-2 text-xs focus:ring-2 focus:ring-[#7b9ab4] focus:border-[#7b9ab4] focus:outline-none transition resize-y font-pinyin leading-relaxed bg-white" placeholder="用空白隔開拼音">anˋ ziiˋ se
siinˇ mungˇ ngˇ
siid bauˋ mangˇ
zang loiˇ liau</textarea>
        </div>

        <!-- 欄位 3：自動格式組合結果 -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs font-medium text-[#5c6e7f]">第三欄：自動組合格式</span>
            <span class="text-[10px] bg-[#e3ecf3] text-[#426077] px-1.5 py-0.5 rounded font-normal">可自行修改</span>
          </div>
          <textarea id="input-content" rows="3" class="custom-scroll w-full text-[#485969] border border-[#d2dfeb] rounded-lg p-2 text-xs focus:ring-1 focus:ring-[#7b9ab4] focus:outline-none transition resize-y font-twkai bg-[#ebf1f6] leading-relaxed" placeholder="系統會自動將第 1 欄與第 2 欄組合產生於此"></textarea>
        </div>
      </div>

      <hr class="border-[#e5edf3]">

      <!-- 格子樣式與尺寸 -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-[#4e6070] mb-1">漢字格樣式</label>
          <select id="grid-style" class="w-full border border-[#cedbe6] rounded-lg p-2 text-xs text-[#2c3842] focus:ring-2 focus:ring-[#7b9ab4] focus:border-[#7b9ab4] focus:outline-none bg-white">
            <option value="mizi" selected>米字格 (傳統四角八向)</option>
            <option value="tianzi">田字格 (標準十字)</option>
            <option value="jiugong">九宮格 (書法間架)</option>
            <option value="square">回宮格 / 純方格</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-[#4e6070] mb-1">拼音格樣式</label>
          <select id="pinyin-style" class="w-full border border-[#cedbe6] rounded-lg p-2 text-xs text-[#2c3842] focus:ring-2 focus:ring-[#7b9ab4] focus:border-[#7b9ab4] focus:outline-none bg-white">
            <option value="four_lines" selected>標準四線三格 (適合初學)</option>
            <option value="two_lines">雙線格 (上界與基線)</option>
            <option value="box_only">單一文字方格</option>
          </select>
        </div>
      </div>

      <!-- 格子大小（4組滿版黃金規格下拉選單）與字體 -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-[#4e6070] mb-1">練習格規格</label>
          <select id="grid-size" class="w-full border border-[#cedbe6] rounded-lg p-2 text-xs text-[#2c3842] focus:ring-2 focus:ring-[#7b9ab4] focus:border-[#7b9ab4] focus:outline-none bg-white">
            <option value="68">特大格：68px</option>
            <option value="59" selected>標準大格：59px</option>
            <option value="53">標準中格：53px</option>
            <option value="45">精緻小格：45px</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-[#4e6070] mb-1">漢字字體</label>
          <select id="font-family" class="w-full border border-[#cedbe6] rounded-lg p-2 text-xs text-[#2c3842] focus:ring-2 focus:ring-[#7b9ab4] focus:border-[#7b9ab4] focus:outline-none bg-white">
            <option value="font-twkai" selected>臺灣楷體 (預設推薦)</option>
            <option value="font-iansuikai">芫荽體 (硬筆楷體)</option>
            <option value="font-handwrite">辰宇落雁體 (溫暖手寫)</option>
            <option value="font-sans">思源黑體 (現代工整)</option>
          </select>
        </div>
      </div>

      <!-- 配色設定 -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-[#4e6070] mb-1">格線配色</label>
          <select id="color-preset" class="w-full border border-[#cedbe6] rounded-lg p-2 text-xs text-[#2c3842] focus:ring-2 focus:ring-[#7b9ab4] focus:border-[#7b9ab4] focus:outline-none bg-white">
            <option value="#dc2626">傳統紅</option>
            <option value="#389F5D" selected>習作綠</option>
            <option value="#0f4c81">藍衫藍</option>
            <option value="#64748b">鉛筆灰</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-[#4e6070] mb-1">描紅文字濃度</label>
          <input type="range" id="trace-opacity" min="0.15" max="0.6" step="0.05" value="0.25" class="w-full accent-[#4a6b82] mt-2">
        </div>
      </div>

      <hr class="border-[#e5edf3]">

      <!-- 頁首自訂欄位 -->
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-[#4e6070] uppercase tracking-wider">
          <i class="fa-solid fa-heading text-[#4a6b82] mr-1.5"></i> A4 橫式頁首標題與班級資訊
        </label>
        <input type="text" id="sheet-title" class="w-full border border-[#cedbe6] rounded-lg px-3 py-1.5 text-xs text-[#2c3842] focus:ring-2 focus:ring-[#7b9ab4] focus:border-[#7b9ab4] focus:outline-none bg-white" value="客家語文生字練習簿" placeholder="輸入頁首主標題">
        
        <div class="grid grid-cols-2 gap-2 text-xs pt-1">
          <label class="flex items-center gap-1.5 text-[#546574] cursor-pointer">
            <input type="checkbox" id="show-student-info" checked class="rounded text-[#4a6b82] focus:ring-[#7b9ab4] accent-[#4a6b82]">
            <span>顯示姓名/班級/座號</span>
          </label>
          <label class="flex items-center gap-1.5 text-[#546574] cursor-pointer">
            <input type="checkbox" id="show-grading" checked class="rounded text-[#4a6b82] focus:ring-[#7b9ab4] accent-[#4a6b82]">
            <span>顯示老師評分欄 (Grade)</span>
          </label>
        </div>
      </div>

    </aside>

    <!-- 右側：A4 橫向即時預覽與列印區塊（頂部常駐固定，字帖區獨立滾動） -->
    <main class="flex-1 flex flex-col h-full overflow-hidden print-area">
      <!-- 右側頂部常駐資訊列：永遠置頂不隨字帖滾動 -->
      <div class="no-print shrink-0 mb-3 w-full flex flex-wrap justify-between items-center text-xs text-[#526473] bg-white px-4 py-2.5 rounded-xl border border-[#dce5ed] shadow-sm gap-2 z-10">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="inline-flex items-center gap-1.5 font-medium text-[#36495b] bg-[#e8f0f6] px-2.5 py-0.5 rounded">
            <i class="fa-regular fa-file-lines text-[#4a6b82]"></i> A4 橫式規格 (297mm × 210mm)
          </span>
          <span class="text-[#c7d5e0]">|</span>
          <span id="page-summary">正在計算分頁...</span>
        </div>
        
        <!-- 縮放與列印提示 -->
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-1.5 bg-[#f0f4f8] px-2 py-1 rounded-lg border border-[#d5e2ed]">
            <i class="fa-solid fa-magnifying-glass text-[#4a6b82] text-[11px]"></i>
            <span class="text-[11px] text-[#4e6070] font-medium">預覽縮放：</span>
            <select id="zoom-select" class="bg-transparent text-xs text-[#2c3842] font-medium focus:outline-none cursor-pointer">
              <option value="fit-page" selected>整頁完整預覽 (寬高最適)</option>
              <option value="fit-width">符合寬度</option>
              <option value="1">100% 原始大小</option>
              <option value="0.85">85%</option>
              <option value="0.75">75%</option>
              <option value="0.65">65%</option>
              <option value="0.5">50%</option>
            </select>
          </div>
          <div class="hidden lg:flex items-center text-[#758897] text-[11px]">
            <i class="fa-solid fa-lightbulb text-[#c49a6c] mr-1"></i>列印請將「邊界」設為「無」
          </div>
        </div>
      </div>

      <!-- 字帖專屬獨立滾動視窗：水平與垂直自然置中 -->
      <div id="pages-viewport" class="custom-scroll flex-1 w-full overflow-y-auto overflow-x-auto p-4 pb-16 flex justify-center">
        <div id="pages-container" class="flex flex-col gap-6 items-center m-auto">
          <!-- Javascript 動態生成 A4 頁面 -->
        </div>
      </div>
    </main>

  </div>

  <script>
    /**
     * 狀態管理物件
     */
    const state = {
      content: '',
      practiceMode: 'word_repeat',
      gridStyle: 'mizi',
      pinyinStyle: 'four_lines',
      gridSize: 59, // 預設 59px (8 行 × 17 格)
      fontFamily: 'font-twkai',
      gridColor: '#389F5D',
      traceOpacity: 0.25,
      sheetTitle: '客家語文生字練習簿',
      showStudentInfo: true,
      showGrading: true,
      zoomMode: 'fit-page'
    };

    // DOM 快取
    const dom = {
      colHanzi: document.getElementById('col-hanzi'),
      colPinyin: document.getElementById('col-pinyin'),
      inputContent: document.getElementById('input-content'),
      practiceMode: document.getElementById('practice-mode'),
      gridStyle: document.getElementById('grid-style'),
      pinyinStyle: document.getElementById('pinyin-style'),
      gridSize: document.getElementById('grid-size'),
      fontFamily: document.getElementById('font-family'),
      colorPreset: document.getElementById('color-preset'),
      traceOpacity: document.getElementById('trace-opacity'),
      sheetTitle: document.getElementById('sheet-title'),
      showStudentInfo: document.getElementById('show-student-info'),
      showGrading: document.getElementById('show-grading'),
      pagesContainer: document.getElementById('pages-container'),
      pagesScrollViewport: document.getElementById('pages-viewport'),
      pageSummary: document.getElementById('page-summary'),
      btnPrint: document.getElementById('btn-print'),
      presetBtns: document.querySelectorAll('.preset-btn'),
      zoomSelect: document.getElementById('zoom-select')
    };

    /**
     * 計算並套用最佳縮放比例
     * 使用 zoom 屬性確保字帖尺寸直接縮放並配合 margin: auto 穩定置中
     */
    function applyZoom() {
      if (!dom.pagesScrollViewport) return;
      const pages = dom.pagesContainer.querySelectorAll('.page-a4-landscape');
      if (pages.length === 0) return;

      // 取得實際可視區域寬高（保留餘裕邊距）
      const viewportWidth = dom.pagesScrollViewport.clientWidth - 40;
      const viewportHeight = dom.pagesScrollViewport.clientHeight - 40;

      const a4WidthPx = 1122.5; // 297mm @ 96DPI
      const a4HeightPx = 793.7; // 210mm @ 96DPI

      let scale = 1;

      if (state.zoomMode === 'fit-page') {
        const scaleW = viewportWidth / a4WidthPx;
        const scaleH = viewportHeight / a4HeightPx;
        scale = Math.min(scaleW, scaleH);
        scale = Math.min(Math.max(scale, 0.35), 1.2);
      } else if (state.zoomMode === 'fit-width') {
        scale = viewportWidth / a4WidthPx;
        scale = Math.min(Math.max(scale, 0.35), 1.2);
      } else {
        scale = parseFloat(state.zoomMode);
      }

      pages.forEach(p => {
        // 優先使用 zoom，瀏覽器能直接正確計算盒模型居中位置
        p.style.zoom = scale;
        // 重設 transform 避免衝突
        p.style.transform = 'none';
        p.style.marginBottom = '0px';
      });
    }

    /**
     * 自動將第一欄（漢字）與第二欄（拼音）組裝至第三欄
     */
    function autoCompose() {
      const hanziLines = dom.colHanzi.value.split('\n');
      const pinyinLines = dom.colPinyin.value.split('\n');
      const maxLines = Math.max(hanziLines.length, pinyinLines.length);

      const combinedLines = [];

      for (let i = 0; i < maxLines; i++) {
        const hLine = (hanziLines[i] || '').trim();
        const pLine = (pinyinLines[i] || '').trim();

        if (!hLine && !pLine) continue;

        const chars = hLine.split('').filter(c => c.trim() !== '');
        const pinyins = pLine.length > 0 ? pLine.split(/[\s]+/) : [];

        const lineResult = [];
        for (let j = 0; j < chars.length; j++) {
          const char = chars[j];
          const py = pinyins[j] || '';
          
          if (/[，。！？、,]/.test(char)) {
            lineResult.push(char);
          } else if (py) {
            lineResult.push(`${char}(${py})`);
          } else {
            lineResult.push(char);
          }
        }

        if (chars.length < pinyins.length && chars.length === 0) {
          pinyins.forEach(py => lineResult.push(`(${py})`));
        }

        combinedLines.push(lineResult.join(' '));
      }

      const finalContent = combinedLines.join('\n');
      dom.inputContent.value = finalContent;
      state.content = finalContent;
      render();
    }

    /**
     * 解析使用者輸入的「字(拼音)」格式
     */
    function parseLines(rawText) {
      const lines = rawText.split('\n');
      const parsedLines = [];

      lines.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) return;

        const wordsInLine = [];
        const tokenRegex = /([\u4e00-\u9fa5\w，。！？、])(?:\(([^)]+)\)|（([^）]+)）)?|[^\s]/g;
        let match;

        while ((match = tokenRegex.exec(trimmed)) !== null) {
          const char = match[1] || match[0];
          const pinyin = match[2] || match[3] || '';
          wordsInLine.push({ char, pinyin });
        }

        if (wordsInLine.length > 0) {
          parsedLines.push(wordsInLine);
        }
      });

      return parsedLines;
    }

    /**
     * 生成拼音格 SVG（四線三格、雙線格）
     */
    function createPinyinSvg(style, strokeColor, height) {
      let lines = '';
      if (style === 'four_lines') {
        lines = `
          <line x1="0" y1="25%" x2="100%" y2="25%" stroke="${strokeColor}" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.6"/>
          <line x1="0" y1="50%" x2="100%" y2="50%" stroke="${strokeColor}" stroke-width="0.8" opacity="0.8"/>
          <line x1="0" y1="75%" x2="100%" y2="75%" stroke="${strokeColor}" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.6"/>
        `;
      } else if (style === 'two_lines') {
        lines = `
          <line x1="0" y1="30%" x2="100%" y2="30%" stroke="${strokeColor}" stroke-width="0.7" opacity="0.7"/>
          <line x1="0" y1="75%" x2="100%" y2="75%" stroke="${strokeColor}" stroke-width="0.8" opacity="0.8"/>
        `;
      }

      return `
        <svg class="grid-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
          <rect x="0" y="0" width="100" height="100" fill="none" stroke="${strokeColor}" stroke-width="1.2"/>
          ${lines}
        </svg>
      `;
    }

    /**
     * 生成漢字格 SVG
     */
    function createCharGridSvg(style, strokeColor) {
      let innerLines = '';
      const dash = '2 2';

      if (style === 'mizi') {
        innerLines = `
          <line x1="0" y1="50" x2="100" y2="50" stroke="${strokeColor}" stroke-width="0.8" stroke-dasharray="${dash}" opacity="0.65" />
          <line x1="50" y1="0" x2="50" y2="100" stroke="${strokeColor}" stroke-width="0.8" stroke-dasharray="${dash}" opacity="0.65" />
          <line x1="0" y1="0" x2="100" y2="100" stroke="${strokeColor}" stroke-width="0.7" stroke-dasharray="${dash}" opacity="0.5" />
          <line x1="0" y1="100" x2="100" y2="0" stroke="${strokeColor}" stroke-width="0.7" stroke-dasharray="${dash}" opacity="0.5" />
        `;
      } else if (style === 'tianzi') {
        innerLines = `
          <line x1="0" y1="50" x2="100" y2="50" stroke="${strokeColor}" stroke-width="0.8" stroke-dasharray="${dash}" opacity="0.7" />
          <line x1="50" y1="0" x2="50" y2="100" stroke="${strokeColor}" stroke-width="0.8" stroke-dasharray="${dash}" opacity="0.7" />
        `;
      } else if (style === 'jiugong') {
        innerLines = `
          <line x1="0" y1="33.3" x2="100" y2="33.3" stroke="${strokeColor}" stroke-width="0.7" stroke-dasharray="${dash}" opacity="0.6" />
          <line x1="0" y1="66.6" x2="100" y2="66.6" stroke="${strokeColor}" stroke-width="0.7" stroke-dasharray="${dash}" opacity="0.6" />
          <line x1="33.3" y1="0" x2="33.3" y2="100" stroke="${strokeColor}" stroke-width="0.7" stroke-dasharray="${dash}" opacity="0.6" />
          <line x1="66.6" y1="0" x2="66.6" y2="100" stroke="${strokeColor}" stroke-width="0.7" stroke-dasharray="${dash}" opacity="0.6" />
        `;
      } else if (style === 'square') {
        innerLines = `
          <rect x="20" y="20" width="60" height="60" fill="none" stroke="${strokeColor}" stroke-width="0.7" stroke-dasharray="${dash}" opacity="0.5" />
        `;
      }

      return `
        <svg class="grid-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
          <rect x="0" y="0" width="100" height="100" fill="none" stroke="${strokeColor}" stroke-width="1.2" />
          ${innerLines}
        </svg>
      `;
    }

    /**
     * 核心渲染
     */
    function render() {
      const parsedLines = parseLines(state.content);

      const a4WidthPx = 1032;
      const a4HeightPx = 670; // 精準安全容納高度

      const charBoxSize = state.gridSize;
      const pinyinHeight = Math.max(22, Math.floor(charBoxSize * 0.42));
      const unitTotalHeight = charBoxSize + pinyinHeight - 1;

      const cols = Math.max(5, Math.floor(a4WidthPx / charBoxSize));
      const rowsPerPage = Math.max(3, Math.floor((a4HeightPx + 1) / unitTotalHeight));

      let allRowsData = [];

      if (state.practiceMode === 'blank_sheet') {
        for (let r = 0; r < rowsPerPage; r++) {
          let rowCells = [];
          for (let c = 0; c < cols; c++) {
            rowCells.push({ char: '', pinyin: '', mode: 'empty' });
          }
          allRowsData.push(rowCells);
        }
      } else if (state.practiceMode === 'word_repeat') {
        const sourceLines = parsedLines.length > 0 ? parsedLines : [[{ char: '客', pinyin: 'hag' }, { char: '家', pinyin: 'gaˊ' }]];
        
        sourceLines.forEach(lineWords => {
          let rowCells = [];
          let wordIdx = 0;
          for (let c = 0; c < cols; c++) {
            const currentItem = lineWords[wordIdx % lineWords.length];
            const isFirstGroup = c < lineWords.length;
            const isSecondGroup = c >= lineWords.length && c < lineWords.length * 2;

            rowCells.push({
              char: currentItem.char,
              pinyin: currentItem.pinyin,
              mode: isFirstGroup ? 'sample' : (isSecondGroup ? 'trace' : 'empty')
            });
            wordIdx++;
          }
          allRowsData.push(rowCells);
        });

      } else if (state.practiceMode === 'first_trace_blank') {
        const sourceLines = parsedLines.length > 0 ? parsedLines : [[{ char: '客', pinyin: 'hag' }]];

        sourceLines.forEach(lineWords => {
          lineWords.forEach(item => {
            let rowCells = [];
            for (let c = 0; c < cols; c++) {
              let cellMode = 'empty';
              if (c === 0) cellMode = 'sample';
              else if (c === 1 || c === 2) cellMode = 'trace';
              
              rowCells.push({
                char: item.char,
                pinyin: item.pinyin,
                mode: cellMode
              });
            }
            allRowsData.push(rowCells);
          });
        });

      } else if (state.practiceMode === 'full_trace') {
        const sourceLines = parsedLines.length > 0 ? parsedLines : [[{ char: '客', pinyin: 'hag' }]];
        sourceLines.forEach(lineWords => {
          let rowCells = [];
          for (let c = 0; c < cols; c++) {
            const currentItem = lineWords[c % lineWords.length];
            rowCells.push({
              char: currentItem.char,
              pinyin: currentItem.pinyin,
              mode: c === 0 ? 'sample' : 'trace'
            });
          }
          allRowsData.push(rowCells);
        });

      } else if (state.practiceMode === 'straight_text') {
        const flatWords = [];
        parsedLines.forEach(line => flatWords.push(...line));

        let currentWordIndex = 0;
        const totalRows = Math.ceil(Math.max(1, flatWords.length) / cols);

        for (let r = 0; r < totalRows; r++) {
          let rowCells = [];
          for (let c = 0; c < cols; c++) {
            if (currentWordIndex < flatWords.length) {
              const item = flatWords[currentWordIndex];
              rowCells.push({
                char: item.char,
                pinyin: item.pinyin,
                mode: 'trace'
              });
              currentWordIndex++;
            } else {
              rowCells.push({ char: '', pinyin: '', mode: 'empty' });
            }
          }
          allRowsData.push(rowCells);
        }
      }

      if (allRowsData.length === 0) {
        allRowsData = [];
      }

      // 自動補齊空白行，直到整頁排滿
      const remainder = allRowsData.length % rowsPerPage;
      if (remainder !== 0 || allRowsData.length === 0) {
        const rowsToFill = rowsPerPage - remainder;
        for (let r = 0; r < rowsToFill; r++) {
          let emptyRow = [];
          for (let c = 0; c < cols; c++) {
            emptyRow.push({ char: '', pinyin: '', mode: 'empty' });
          }
          allRowsData.push(emptyRow);
        }
      }

      const totalPages = Math.ceil(allRowsData.length / rowsPerPage);
      dom.pageSummary.innerHTML = `每頁 <strong>${rowsPerPage}</strong> 行 × <strong>${cols}</strong> 格（共 <strong>${totalPages}</strong> 頁）`;

      dom.pagesContainer.innerHTML = '';

      const pinyinSvg = createPinyinSvg(state.pinyinStyle, state.gridColor, pinyinHeight);
      const charSvg = createCharGridSvg(state.gridStyle, state.gridColor);

      for (let p = 0; p < totalPages; p++) {
        const pageRows = allRowsData.slice(p * rowsPerPage, (p + 1) * rowsPerPage);

        const pageEl = document.createElement('div');
        pageEl.className = 'page-a4-landscape';

        const headerEl = document.createElement('header');
        headerEl.className = 'w-full pb-2 mb-2 border-b-2 border-[#2b3a47] flex justify-between items-end';

        let headerHtml = `
          <div>
            <h2 class="text-xl font-bold tracking-widest text-[#1c2730] font-twkai">${state.sheetTitle}</h2>
          </div>
        `;

        let rightMeta = `<div class="flex items-center gap-4 text-xs text-[#485b6b] font-twkai">`;
        if (state.showStudentInfo) {
          rightMeta += `
            <span class="border-b border-[#6d8294] pb-0.5 min-w-[100px]">班級：</span>
            <span class="border-b border-[#6d8294] pb-0.5 min-w-[65px]">座號：</span>
            <span class="border-b border-[#6d8294] pb-0.5 min-w-[130px]">姓名：</span>
          `;
        }
        if (state.showGrading) {
          rightMeta += `
            <span class="inline-flex items-center gap-1.5 font-bold text-[#1c2730]">
              評分：<span class="inline-block w-14 h-9 border-2 border-[#6d8294] rounded bg-white"></span>
            </span>
          `;
        }
        rightMeta += `<span class="text-[#879cb0] text-[11px] ml-1">第 ${p + 1}/${totalPages} 頁</span></div>`;
        headerEl.innerHTML = headerHtml + rightMeta;
        pageEl.appendChild(headerEl);

        const gridBody = document.createElement('div');
        gridBody.className = 'flex-1 flex flex-col justify-start';

        pageRows.forEach((rowCells, rIdx) => {
          const rowEl = document.createElement('div');
          rowEl.className = 'flex items-center justify-start';
          rowEl.style.width = `${cols * charBoxSize}px`;
          rowEl.style.margin = '0 auto';
          if (rIdx > 0) {
            rowEl.style.marginTop = '-1px';
          }

          rowCells.forEach(cell => {
            const unit = document.createElement('div');
            unit.className = 'flex flex-col shrink-0';
            unit.style.width = `${charBoxSize}px`;
            unit.style.marginRight = '-1px';

            const pinyinBox = document.createElement('div');
            pinyinBox.className = 'relative flex items-center justify-center font-pinyin select-none overflow-hidden';
            pinyinBox.style.height = `${pinyinHeight}px`;
            pinyinBox.style.width = `${charBoxSize}px`;
            pinyinBox.innerHTML = pinyinSvg;

            const charBox = document.createElement('div');
            charBox.className = 'relative flex items-center justify-center select-none overflow-hidden';
            charBox.style.height = `${charBoxSize}px`;
            charBox.style.width = `${charBoxSize}px`;
            charBox.style.marginTop = '-1px';
            charBox.innerHTML = charSvg;

            if (cell.mode === 'sample') {
              if (cell.pinyin) {
                pinyinBox.innerHTML += `<span class="relative z-10 text-[#141b21] font-bold leading-none tracking-tight font-pinyin" style="font-size: ${Math.floor(pinyinHeight * 0.65)}px; padding-bottom: 2px;">${cell.pinyin}</span>`;
              }
              if (cell.char) {
                charBox.innerHTML += `<span class="relative z-10 ${state.fontFamily} text-[#141b21] font-medium leading-none" style="font-size: ${Math.floor(charBoxSize * 0.72)}px">${cell.char}</span>`;
              }
            } else if (cell.mode === 'trace') {
              if (cell.pinyin) {
                pinyinBox.innerHTML += `<span class="relative z-10 font-pinyin font-bold leading-none tracking-tight" style="font-size: ${Math.floor(pinyinHeight * 0.65)}px; color: ${state.gridColor}; opacity: ${state.traceOpacity}; padding-bottom: 2px;">${cell.pinyin}</span>`;
              }
              if (cell.char) {
                charBox.innerHTML += `<span class="relative z-10 ${state.fontFamily} leading-none font-medium" style="font-size: ${Math.floor(charBoxSize * 0.72)}px; color: #4b5563; opacity: ${state.traceOpacity}">${cell.char}</span>`;
              }
            }

            unit.appendChild(pinyinBox);
            unit.appendChild(charBox);
            rowEl.appendChild(unit);
          });

          gridBody.appendChild(rowEl);
        });

        pageEl.appendChild(gridBody);

        const footerEl = document.createElement('footer');
        footerEl.className = 'w-full pt-1.5 mt-auto shrink-0 border-t border-[#dce5ed] flex justify-between items-center text-[10px] text-[#879cb0]';
        footerEl.innerHTML = `
          <span>臺灣客家語文生字簿 &bull; 客語書寫練習 &bull; A4 橫式列印</span>
          <span>按時練習 &bull; 傳承客家好語言</span>
        `;
        pageEl.appendChild(footerEl);

        dom.pagesContainer.appendChild(pageEl);
      }

      applyZoom();
    }

    /**
     * 綁定控制項事件
     */
    function initListeners() {
      dom.colHanzi.addEventListener('input', autoCompose);
      dom.colPinyin.addEventListener('input', autoCompose);

      dom.inputContent.addEventListener('input', (e) => {
        state.content = e.target.value;
        render();
      });

      dom.practiceMode.addEventListener('change', (e) => {
        state.practiceMode = e.target.value;
        render();
      });

      dom.gridStyle.addEventListener('change', (e) => {
        state.gridStyle = e.target.value;
        render();
      });

      dom.pinyinStyle.addEventListener('change', (e) => {
        state.pinyinStyle = e.target.value;
        render();
      });

      dom.gridSize.addEventListener('change', (e) => {
        state.gridSize = parseInt(e.target.value, 10);
        render();
      });

      dom.fontFamily.addEventListener('change', (e) => {
        state.fontFamily = e.target.value;
        render();
      });

      dom.colorPreset.addEventListener('change', (e) => {
        state.gridColor = e.target.value;
        render();
      });

      dom.traceOpacity.addEventListener('input', (e) => {
        state.traceOpacity = parseFloat(e.target.value);
        render();
      });

      dom.sheetTitle.addEventListener('input', (e) => {
        state.sheetTitle = e.target.value;
        render();
      });

      dom.showStudentInfo.addEventListener('change', (e) => {
        state.showStudentInfo = e.target.checked;
        render();
      });

      dom.showGrading.addEventListener('change', (e) => {
        state.showGrading = e.target.checked;
        render();
      });

      dom.zoomSelect.addEventListener('change', (e) => {
        state.zoomMode = e.target.value;
        applyZoom();
      });

      window.addEventListener('resize', () => {
        if (state.zoomMode === 'fit-page' || state.zoomMode === 'fit-width') {
          applyZoom();
        }
      });

      dom.presetBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const hanzi = btn.getAttribute('data-hanzi');
          const pinyin = btn.getAttribute('data-pinyin');
          const title = btn.getAttribute('data-title');

          if (hanzi && pinyin) {
            dom.colHanzi.value = hanzi;
            dom.colPinyin.value = pinyin;
            autoCompose();
          }

          if (title) {
            dom.sheetTitle.value = title;
            state.sheetTitle = title;
            render();
          }
        });
      });

      dom.btnPrint.addEventListener('click', () => {
        window.print();
      });

      // 滾動條動態淡入淡出監聽：捲動時淡入，停止 1 秒後淡出
      function setupScrollFade(element) {
        let timer = null;
        element.addEventListener('scroll', () => {
          element.classList.add('is-scrolling');
          clearTimeout(timer);
          timer = setTimeout(() => {
            element.classList.remove('is-scrolling');
          }, 1000);
        }, { passive: true });
      }

      const asideEl = document.querySelector('aside');
      if (asideEl) setupScrollFade(asideEl);
      if (dom.pagesScrollViewport) setupScrollFade(dom.pagesScrollViewport);
      if (dom.colHanzi) setupScrollFade(dom.colHanzi);
      if (dom.colPinyin) setupScrollFade(dom.colPinyin);
      if (dom.inputContent) setupScrollFade(dom.inputContent);
    }

    window.addEventListener('DOMContentLoaded', () => {
      initListeners();
      autoCompose();
    });
  </script>
</body>
</html>

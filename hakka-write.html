<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>臺灣客家語文習字簿產生器 (A4橫式)</title>
  <!-- Google Fonts: 備用英數與襯線字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Charis+SIL:ital,wght@0,400;0,700;1,400&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* 引入字體資料夾的芫荽體 */
    @font-face {
      font-family: 'Iansui';
      src: url('./fonts/Iansui-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    /* 引入字體資料夾的臺灣楷體 */
    @font-face {
      font-family: 'TaiwanKaiti';
      src: url('./fonts/Taiwan-Kaiti.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    /* 引入字體資料夾的辰宇落雁體 */
    @font-face {
      font-family: 'ChenYuluoyan';
      src: url('./fonts/ChenYuluoyan.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    /* 莫蘭迪霧霾藍柔和背景 */
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #eef3f6;
      color: #2c3842;
    }

    /* 漢字字體選項 */
    .font-twkai {
      font-family: 'TaiwanKaiti', 'Iansui', 'DFKai-SB', 'BiauKai', '標楷體', cursive, serif;
    }
    .font-iansuikai {
      font-family: 'Iansui', 'TaiwanKaiti', 'DFKai-SB', 'BiauKai', '標楷體', cursive, serif;
    }
    .font-handwrite {
      font-family: 'ChenYuluoyan', 'Iansui', 'TaiwanKaiti', serif;
    }
    .font-sans {
      font-family: 'Noto Sans TC', sans-serif;
    }

    /* 客語拼音字體：固定為使用臺灣楷體 */
    .font-pinyin {
      font-family: 'TaiwanKaiti', 'Charis SIL', 'DFKai-SB', 'BiauKai', '標楷體', sans-serif !important;
    }

    /* 固定 A4 橫式 (Landscape) 規格: 297mm x 210mm */
    .page-a4-landscape {
      width: 297mm;
      min-height: 210mm;
      height: 210mm;
      max-height: 210mm;
      padding: 10mm 12mm 8mm 12mm;
      margin: 0 auto;
      background: white;
      box-shadow: 0 10px 28px -5px rgba(36, 47, 61, 0.09), 0 8px 12px -6px rgba(36, 47, 61, 0.04);
      position: relative;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      overflow: hidden;
      page-break-after: always;
      break-after: page;
      border-radius: 2px;
    }

    /* 列印最佳化 */
    @media print {
      body {
        background: transparent !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      .print-area {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
      }
      .page-a4-landscape {
        box-shadow: none !important;
        margin: 0 !important;
        width: 297mm !important;
        height: 210mm !important;
        padding: 8mm 10mm !important;
        page-break-after: always !important;
        break-after: page !important;
      }
      @page {
        size: A4 landscape;
        margin: 0;
      }
    }

    .grid-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #c3cfd9;
      border-radius: 4px;
    }

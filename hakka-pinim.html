<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>客語三行對照排版（四縣・漢字・海陸）</title>
<style>
:root{
  --bg:#f6f3ee; --panel:#fffdf9; --ink:#1d2433; --muted:#6b7385; --line:#d9d3c7;
  --sixian:#1f5fa8; --hailu:#b3402a; --accent:#23406e;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14171e; --panel:#1c2029; --ink:#e8e6e1; --muted:#9aa1b0; --line:#343a48;
         --sixian:#7fb2ee; --hailu:#f0a08c; --accent:#8fb0e6; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6}
main{max-width:960px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:1.5rem;margin:0 0 4px;color:var(--accent)}
p.sub{margin:0 0 20px;color:var(--muted);font-size:.95rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:20px}
label.t{display:block;font-weight:600;margin-bottom:6px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:720px){.cols{grid-template-columns:1fr}}
.cols label.t.sx{color:var(--sixian)} .cols label.t.hl{color:var(--hailu)}
textarea{width:100%;min-height:170px;white-space:pre;overflow:auto;padding:10px;font-size:1rem;line-height:1.7;
  border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",monospace;resize:vertical}
textarea:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:.88rem;color:var(--muted);margin:8px 0 0}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:12px}
.bar label{font-size:.92rem;color:var(--muted)}
.bar input[type=number]{width:64px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
button{padding:7px 14px;font-size:.95rem;border:1px solid var(--accent);border-radius:6px;
  background:var(--accent);color:#fff;cursor:pointer}
button.alt{background:transparent;color:var(--accent)}
@media (prefers-color-scheme: dark){ button{color:#14171e} button.alt{color:var(--accent)} }
#msg{font-size:.88rem;color:var(--hailu);min-height:1.3em;margin-top:8px}
#out{background:#fff;color:#1d2433;border:1px solid var(--line);border-radius:8px;padding:16px;min-height:80px}
#stage{position:relative}
#stage:fullscreen,#stage.fs{background:#fff;overflow:auto;padding:64px 24px 24px;width:100%;height:100%}
#stage.fs{position:fixed;inset:0;z-index:99}
#stage:fullscreen #out,#stage.fs #out{border:0;min-height:0;padding:8px 8px 48px}
#fsbar{display:none;position:fixed;top:10px;right:10px;z-index:100;align-items:center;gap:6px;
  padding:6px;background:rgba(255,255,255,.95);border:1px solid #d9d3c7;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#stage:fullscreen #fsbar,#stage.fs #fsbar{display:flex}
#fsbar button{padding:4px 10px;min-width:36px}
#zl{min-width:48px;text-align:center;font-size:.9rem;color:#1d2433;font-variant-numeric:tabular-nums}
#out .warn{color:#b3402a;font-size:.85rem;margin:0 0 4px}
table.h{border-collapse:collapse;margin:0 0 18px;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
table.h td{padding:2px 6px;text-align:center;white-space:nowrap}
table.h td.lab{font-size:.8rem;font-weight:700;text-align:left;padding-right:12px;border-right:2px solid #c9c2b4}
tr.sx td{font-size:.95rem;color:#1f5fa8}
tr.sx td.lab{color:#1f5fa8}
tr.hz td{font-size:1.7rem;color:#1d2433;padding-top:0;padding-bottom:0}
tr.hz td.lab{font-size:.8rem;color:#6b7385}
tr.hl td{font-size:.95rem;color:#b3402a}
tr.hl td.lab{color:#b3402a}
</style>
</head>
<body>
<main>
  <h1>客語三行對照排版</h1>
  <p class="sub">上排四縣腔拼音、中間漢字、下排海陸腔拼音，逐字對齊。</p>

  <section class="panel">
    <div class="cols">
      <div><label class="t sx" for="sx">四縣腔拼音</label><textarea id="sx" wrap="off" spellcheck="false"></textarea></div>
      <div><label class="t" for="hz">漢字</label><textarea id="hz" wrap="off" spellcheck="false"></textarea></div>
      <div><label class="t hl" for="hl">海陸腔拼音</label><textarea id="hl" wrap="off" spellcheck="false"></textarea></div>
    </div>
    <p class="hint">
      三欄各貼一份，第 N 行互相對應（一行＝一句）。拼音以空格分隔，一個音節對應一個漢字，標點會自動略過。
      拼音欄可以整欄或整行留白；若只想讓某個字不標拼音，在該位置填 <code>_</code> 即可。
    </p>
    <div class="bar">
      <label>每列字數 <input type="number" id="per" value="8" min="2" max="30"></label>
      <button id="go">產生對照</button>
      <button id="copy" class="alt">複製結果</button>
      <button id="full" class="alt">全螢幕</button>
      <button id="png" class="alt">匯出圖片</button>
      <button id="clr" class="alt">清空</button>
    </div>
    <div id="msg" role="status"></div>
  </section>

  <div id="stage">
    <div id="fsbar">
      <button id="zo" type="button" class="alt" aria-label="縮小">－</button>
      <span id="zl" aria-live="polite">100%</span>
      <button id="zi" type="button" class="alt" aria-label="放大">＋</button>
      <button id="zr" type="button" class="alt">還原</button>
      <button id="png2" type="button" class="alt">匯出圖片</button>
      <button id="exit" type="button">離開全螢幕</button>
    </div>
    <section id="out" aria-live="polite"></section>
  </div>
</main>

<script>
const HAN = /[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\u{20000}-\u{2ffff}]/u;
const PUNCT_ONLY = /^[\s、，。！？；：「」『』（）()—…,.!?;:"'‧·\-]+$/;
const $ = id => document.getElementById(id);

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function tokens(line){
  return line.trim().split(/\s+/).filter(t => t && !PUNCT_ONLY.test(t))
    .map(t => /^[_＿]+$/.test(t) ? '' : t);
}

const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
const LAB_W = 64;

function toCells(sx, hz, hl){
  const chars = Array.from(hz.trim());
  const a = tokens(sx), b = tokens(hl);
  const cells = []; let i = 0;
  for (const c of chars){
    if (HAN.test(c)) cells.push({h:c, s:a[i]||'', l:b[i]||''}), i++;
    else cells.push({h:c, s:'', l:''});
  }
  return cells;
}

/* 網頁顯示用：原本的樣式 */
function screenGroup(cells, per){
  let html = '';
  for (let k = 0; k < cells.length; k += per){
    const seg = cells.slice(k, k + per);
    const row = (cls, lab, key) =>
      `<tr class="${cls}"><td class="lab">${lab}</td>` +
      seg.map(x => `<td>${esc(x[key]) || '&nbsp;'}</td>`).join('') + `</tr>`;
    html += `<table class="h">${row('sx','四縣腔','s')}${row('hz','漢字','h')}${row('hl','海陸腔','l')}</table>`;
  }
  return html;
}

/* 複製用：固定欄寬＋樣式寫進每個儲存格，貼到 Word 等軟體不會跑位 */
function copyGroup(cells, per, colW){
  let html = '';
  for (let k = 0; k < cells.length; k += per){
    const seg = cells.slice(k, k + per);
    const total = LAB_W + colW * seg.length;
    const td = (txt, size, color) =>
      `<td width="${colW}" style="width:${colW}px;padding:2px 0;text-align:center;white-space:nowrap;` +
      `font-family:${FONT};font-size:${size}px;line-height:1.4;color:${color}">${esc(txt) || '&nbsp;'}</td>`;
    const lab = (txt, color) =>
      `<td width="${LAB_W}" style="width:${LAB_W}px;padding:2px 8px 2px 0;text-align:left;white-space:nowrap;` +
      `font-family:${FONT};font-size:13px;font-weight:700;color:${color};border-right:2px solid #c9c2b4">${txt}</td>`;
    html += `<table border="0" cellspacing="0" cellpadding="0" width="${total}" ` +
      `style="border-collapse:collapse;table-layout:fixed;width:${total}px">` +
      `<colgroup><col width="${LAB_W}">${seg.map(() => `<col width="${colW}">`).join('')}</colgroup>` +
      `<tr>${lab('四縣腔','#1f5fa8')}${seg.map(x => td(x.s, 15, '#1f5fa8')).join('')}</tr>` +
      `<tr>${lab('漢字','#6b7385')}${seg.map(x => td(x.h, 27, '#1d2433')).join('')}</tr>` +
      `<tr>${lab('海陸腔','#b3402a')}${seg.map(x => td(x.l, 15, '#b3402a')).join('')}</tr>` +
      `</table><p style="margin:0;line-height:14px;font-size:10px">&nbsp;</p>`;
  }
  return html;
}

function buildAll(forCopy){
  const per = Math.max(2, Math.min(30, parseInt($('per').value) || 8));
  const lines = id => $(id).value.replace(/\r/g,'').split('\n');
  const A = lines('sx'), H = lines('hz'), B = lines('hl');
  let maxLen = 3;
  [...A, ...B].forEach(l => tokens(l).forEach(t => { maxLen = Math.max(maxLen, t.length); }));
  const colW = Math.max(44, Math.ceil(maxLen * 8.5) + 14);   // 複製時全部欄位統一寬度
  let html = '';
  for (let k = 0; k < H.length; k++){
    if (!H[k].trim()) continue;
    const cells = toCells(A[k] || '', H[k], B[k] || '');
    html += forCopy ? copyGroup(cells, per, colW) : screenGroup(cells, per);
  }
  return html;
}

function render(){
  $('out').innerHTML = buildAll(false) || '<p style="color:#6b7385;margin:0">尚無內容，請在漢字欄貼上文字。</p>';
  $('msg').textContent = '';
}

async function exportPng(){
  const per = Math.max(2, Math.min(30, parseInt($('per').value) || 8));
  const lines = id => $(id).value.replace(/\r/g,'').split('\n');
  const A = lines('sx'), H = lines('hz'), B = lines('hl');
  const chunks = [];
  for (let k = 0; k < H.length; k++){
    if (!H[k].trim()) continue;
    const cells = toCells(A[k] || '', H[k], B[k] || '');
    for (let i = 0; i < cells.length; i += per) chunks.push(cells.slice(i, i + per));
  }
  if (!chunks.length){ $('msg').textContent = '尚無內容可匯出。'; return; }
  try{ await document.fonts.ready; }catch(_){}

  const F_PY = `15px ${FONT}`, F_HZ = `27px ${FONT}`, F_LB = `700 13px ${FONT}`;
  const PAD = 28, GAP = 18, RH = [26, 46, 26];
  const m = document.createElement('canvas').getContext('2d');
  m.font = F_PY;
  let colW = 44;
  chunks.forEach(seg => seg.forEach(x => {
    colW = Math.max(colW, Math.ceil(Math.max(m.measureText(x.s).width, m.measureText(x.l).width)) + 14);
  }));
  const maxCols = Math.max(...chunks.map(c => c.length));
  const tableH = RH[0] + RH[1] + RH[2];
  const W = PAD * 2 + LAB_W + colW * maxCols;
  const Hh = PAD * 2 + chunks.length * tableH + (chunks.length - 1) * GAP;
  const scale = Math.max(1, Math.min(3, 16000 / Math.max(W, Hh), Math.sqrt(100e6 / (W * Hh))));

  const cv = document.createElement('canvas');
  cv.width = Math.round(W * scale); cv.height = Math.round(Hh * scale);
  const c = cv.getContext('2d');
  c.scale(scale, scale);
  c.fillStyle = '#fff'; c.fillRect(0, 0, W, Hh);
  c.textBaseline = 'middle';

  chunks.forEach((seg, n) => {
    const y0 = PAD + n * (tableH + GAP);
    const rows = [
      {key:'s', lab:'四縣腔', color:'#1f5fa8', font:F_PY, h:RH[0], lc:'#1f5fa8'},
      {key:'h', lab:'漢字',   color:'#1d2433', font:F_HZ, h:RH[1], lc:'#6b7385'},
      {key:'l', lab:'海陸腔', color:'#b3402a', font:F_PY, h:RH[2], lc:'#b3402a'}
    ];
    let y = y0;
    rows.forEach(r => {
      const cy = y + r.h / 2;
      c.textAlign = 'left'; c.font = F_LB; c.fillStyle = r.lc;
      c.fillText(r.lab, PAD, cy);
      c.textAlign = 'center'; c.font = r.font; c.fillStyle = r.color;
      seg.forEach((x, i) => { if (x[r.key]) c.fillText(x[r.key], PAD + LAB_W + colW * i + colW / 2, cy); });
      y += r.h;
    });
    c.fillStyle = '#c9c2b4'; c.fillRect(PAD + LAB_W - 6, y0, 2, tableH);
  });

  cv.toBlob(blob => {
    if (!blob){ $('msg').textContent = '匯出失敗，圖片可能太大，請調小「每列字數」或分批匯出。'; return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '客語三行對照.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    $('msg').textContent = '已匯出圖片（白底 PNG）。';
  }, 'image/png');
}

function plainText(){
  const rows = [];
  $('out').querySelectorAll('table').forEach(t => {
    t.querySelectorAll('tr').forEach(tr =>
      rows.push([...tr.children].map(td => td.textContent.replace(/\u00a0/g,'')).join('\t')));
    rows.push('');
  });
  return rows.join('\n');
}

$('go').onclick = render;
$('per').oninput = render;
$('clr').onclick = () => { ['sx','hz','hl'].forEach(id => $(id).value = ''); render(); };
['sx','hz','hl'].forEach(id => $(id).addEventListener('input', render));
$('copy').onclick = async () => {
  const html = '<meta charset="utf-8">' + buildAll(true), text = plainText();
  try{
    await navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html], {type:'text/html'}),
      'text/plain': new Blob([text], {type:'text/plain'})
    })]);
    $('msg').textContent = '已複製，可直接貼到 Word、Google 文件或簡報。';
  }catch(e){
    const box = document.createElement('div');
    box.innerHTML = buildAll(true);
    box.style.cssText = 'position:fixed;left:-9999px;top:0;background:#fff';
    document.body.appendChild(box);
    const r = document.createRange(); r.selectNodeContents(box);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    let ok = false; try{ ok = document.execCommand('copy'); }catch(_){}
    sel.removeAllRanges(); box.remove();
    $('msg').textContent = ok ? '已複製，可直接貼到 Word、Google 文件或簡報。' : '複製失敗，請手動選取結果後複製。';
  }
};

const stage = $('stage');
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
const inFs = () => fsEl() === stage || stage.classList.contains('fs');

let zoom = 1;
function applyZoom(){
  $('out').style.zoom = inFs() ? zoom : '';
  $('zl').textContent = Math.round(zoom * 100) + '%';
}
function setZoom(z){ zoom = Math.max(0.5, Math.min(5, z)); applyZoom(); }

function enterFs(){
  const req = stage.requestFullscreen || stage.webkitRequestFullscreen;
  if (req){
    Promise.resolve(req.call(stage)).catch(() => { stage.classList.add('fs'); applyZoom(); });
  } else {
    stage.classList.add('fs');   // iPhone Safari 等不支援時，改用覆蓋整個畫面的方式
    applyZoom();
  }
}
function exitFs(){
  if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  stage.classList.remove('fs');
  applyZoom();
}
$('full').onclick = enterFs;
$('png').onclick = exportPng;
$('png2').onclick = exportPng;
$('exit').onclick = exitFs;
$('zi').onclick = () => setZoom(zoom * 1.15);
$('zo').onclick = () => setZoom(zoom / 1.15);
$('zr').onclick = () => setZoom(1);
document.addEventListener('fullscreenchange', applyZoom);
document.addEventListener('webkitfullscreenchange', applyZoom);
document.addEventListener('keydown', e => {
  if (!inFs()) return;
  if (e.key === 'Escape') { stage.classList.remove('fs'); applyZoom(); }
  else if (e.key === '+' || e.key === '=') setZoom(zoom * 1.15);
  else if (e.key === '-' || e.key === '_') setZoom(zoom / 1.15);
  else if (e.key === '0') setZoom(1);
});
stage.addEventListener('wheel', e => {
  if (inFs() && (e.ctrlKey || e.metaKey)){ e.preventDefault(); setZoom(zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1)); }
}, {passive:false});

render();
</script>
</body>
</html>

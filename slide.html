<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>簡報批註工具</title>
<style>
:root{--bg:#1b1d22;--bar:#262a32;--fg:#eceef3;--line:#3a4050;--acc:#ffb703}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font:14px/1.4 system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
#stage{position:absolute;inset:0 0 64px 0;overflow:hidden}
body.fs #stage{bottom:0}
#base,#ink,#laser{position:absolute;left:0;top:0;width:100%;height:100%;display:none}
#laser{pointer-events:none}
[hidden]{display:none!important}
#base{transform-origin:0 0}
#ink{touch-action:none}
body.has #base,body.has #ink,body.has #laser{display:block}
body.has #drop{display:none}
#drop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;padding:48px 40px;
  border:2px dashed var(--line);border-radius:14px;width:min(520px,90vw)}
#drop.over{border-color:var(--acc)}
#drop h1{margin:0 0 8px;font-size:22px}
#drop p{margin:0 0 20px;color:#a9afbd}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:44px;height:44px;padding:0 10px;
  background:transparent;color:var(--fg);border:1px solid transparent;border-radius:10px;font:inherit;font-size:18px;cursor:pointer}
.btn:hover{background:#ffffff14}
.btn.on{border-color:var(--acc);background:#ffb70322}
.btn:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.txt{font-size:14px}
.primary{background:var(--acc);color:#1b1d22;font-weight:600;padding:0 22px;font-size:15px}
.primary:hover{background:#ffc43a}
#bar{position:fixed;left:0;right:0;bottom:0;height:64px;background:var(--bar);border-top:1px solid var(--line);
  display:flex;align-items:center;gap:4px;padding:0 10px;overflow-x:auto;transition:opacity .25s;z-index:4}
#bar>*{flex:none}
#bar>:first-child{margin-left:auto}
#bar>:last-child{margin-right:auto}
body.fs #bar{border-radius:14px 14px 0 0;left:50%;right:auto;transform:translateX(-50%);max-width:100%}
body.fs.bi #bar{opacity:0;pointer-events:none}
#fab{display:none;position:fixed;right:14px;bottom:14px;z-index:5;background:var(--bar);border:1px solid var(--line);opacity:.65}
body.fs.bi #fab{display:inline-flex}
.sep{width:1px;height:28px;background:var(--line);margin:0 6px}
.sw{width:30px;height:30px;min-width:30px;padding:0;border-radius:50%;border:2px solid #0006;margin:0 2px}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
#pg{min-width:70px;text-align:center;font-variant-numeric:tabular-nums}
#zl{min-width:62px;font-size:14px;font-variant-numeric:tabular-nums}
select{height:40px;background:var(--bar);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:0 8px;font:inherit}
</style>
</head>
<body>
<div id="stage">
  <div id="drop">
    <h1>上傳簡報，直接在上面寫字</h1>
    <p>拖曳 PDF 或圖片到這裡，或按下方按鈕選擇檔案。<br>PowerPoint 請先另存為 PDF。</p>
    <label class="btn primary" for="file">選擇檔案</label>
  </div>
  <canvas id="base"></canvas>
  <canvas id="ink"></canvas>
  <canvas id="laser"></canvas>
</div>

<div id="bar">
  <label class="btn" for="file" title="開啟檔案">📂</label>
  <input id="file" type="file" accept="application/pdf,image/*" multiple hidden>
  <span class="sep"></span>
  <button class="btn" id="prev" title="上一頁（←）">◀</button>
  <span id="pg">0 / 0</span>
  <button class="btn" id="next" title="下一頁（→ 或空白鍵）">▶</button>
  <span class="sep"></span>
  <button class="btn tool on" data-t="pen" title="隨意線 畫筆（P）">✏️</button>
  <button class="btn tool" data-t="hl" title="螢光筆（H）">🖍</button>
  <button class="btn tool" data-t="line" title="直線（L）：接近水平或垂直時會自動拉直">╱</button>
  <button class="btn tool" data-t="rect" title="方形（R）：接近正方形時會自動變正方形">▭</button>
  <button class="btn tool" data-t="ell" title="圓形（O）：接近正圓時會自動變正圓">◯</button>
  <button class="btn tool" data-t="er" title="橡皮擦（E）">🧽</button>
  <button class="btn tool" data-t="laser" title="雷射筆（B）：紅色光暈＋白色細線，3 秒後自動消失，不會留在頁面上">🔴</button>
  <button class="btn tool" data-t="pan" title="平移畫面（V）">🖐</button>
  <span class="sep"></span>
  <button class="btn sw on" data-c="#e53935" style="background:#e53935" aria-label="紅"></button>
  <button class="btn sw" data-c="#1e88e5" style="background:#1e88e5" aria-label="藍"></button>
  <button class="btn sw" data-c="#43a047" style="background:#43a047" aria-label="綠"></button>
  <button class="btn sw" data-c="#fdd835" style="background:#fdd835" aria-label="黃"></button>
  <button class="btn sw" data-c="#111111" style="background:#111" aria-label="黑"></button>
  <button class="btn sw" data-c="#ffffff" style="background:#fff" aria-label="白"></button>
  <select id="mult" aria-label="粗細">
    <option value="0.6">細</option><option value="1" selected>中</option><option value="2">粗</option><option value="3.5">特粗</option>
  </select>
  <span class="sep"></span>
  <button class="btn" id="undo" title="復原（Ctrl+Z）">↶</button>
  <button class="btn" id="clear" title="清除本頁（Delete）">🗑</button>
  <span class="sep"></span>
  <button class="btn" id="zout" title="縮小（-）">－</button>
  <button class="btn txt" id="zl" title="回到完整頁面（0）">100%</button>
  <button class="btn" id="zin" title="放大（+）">＋</button>
  <button class="btn txt on" id="td" title="開啟：筆與手指都能寫字（雙指仍可縮放平移）。關閉：手指只能平移縮放">觸控寫字</button>
  <button class="btn" id="full" title="全螢幕（F）">⛶</button>
</div>
<button class="btn" id="fab" title="顯示工具列">☰</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=s=>document.querySelector(s);
const stage=$('#stage'),base=$('#base'),ink=$('#ink'),bctx=base.getContext('2d'),ictx=ink.getContext('2d');
const off=document.createElement('canvas'),octx=off.getContext('2d');
const laserC=$('#laser'),lctx=laserC.getContext('2d');
let doc=null,imgs=null,curPage=null,total=0,cur=1,nav=0,strokes={};
let tool='pen',color='#e53935',mult=1,touchDraw=true;
let pw=0,ph=0;                 // 目前頁面原始尺寸
let V={z:1,x:0,y:0};           // 檢視：放大倍率、頁面左上角在畫面上的位置（css px）
let R={w:1,x:0,y:0};           // 底圖最後一次清晰渲染時的狀態
let token=0,task=null,drawing=null,raf=0,settle=0;
const W0={pen:3,hl:16,er:22,line:3,rect:3,ell:3};
const dpr=()=>window.devicePixelRatio||1;
const SW=()=>stage.clientWidth,SH=()=>stage.clientHeight;
const fit=()=>Math.min((SW()-24)/pw,(SH()-24)/ph);
const cw=()=>pw*fit()*V.z,ch=()=>ph*fit()*V.z;

/* ---------- 開檔與換頁 ---------- */
async function openFiles(list){
  const files=[...list];if(!files.length)return;
  const pdf=files.find(f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name));
  try{
    if(pdf){doc=await pdfjsLib.getDocument({data:await pdf.arrayBuffer()}).promise;imgs=null;total=doc.numPages}
    else{
      const im=files.filter(f=>f.type.startsWith('image/')).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
      if(!im.length){alert('請選擇 PDF 或圖片檔。PowerPoint 請先另存為 PDF。');return}
      imgs=await Promise.all(im.map(f=>createImageBitmap(f)));doc=null;total=imgs.length;
    }
  }catch(err){alert('檔案無法開啟：'+err.message);return}
  strokes={};document.body.classList.add('has');load(1);
}
async function load(n){
  n=Math.max(1,Math.min(total,n));const t=++nav;
  if(doc){const p=await doc.getPage(n);if(t!==nav)return;curPage=p;const v=p.getViewport({scale:1});pw=v.width;ph=v.height}
  else{const b=imgs[n-1];pw=b.width;ph=b.height}
  cur=n;laser=[];lcur=null;V.z=1;clampV();render();
}
const go=n=>{if(total&&n>=1&&n<=total&&n!==cur)load(n)};

/* ---------- 檢視（縮放、平移） ---------- */
function clampV(){
  const W=SW(),H=SH(),w=cw(),h=ch();
  V.x=w<=W?(W-w)/2:Math.min(40,Math.max(W-w-40,V.x));
  V.y=h<=H?(H-h)/2:Math.min(40,Math.max(H-h-40,V.y));
}
function zoomAt(cx,cy,z){
  z=Math.max(1,Math.min(8,z));const u=(cx-V.x)/cw(),v=(cy-V.y)/ch();
  V.z=z;V.x=cx-u*cw();V.y=cy-v*ch();clampV();applyLive();
}
function setTransform(){
  const k=cw()/R.w;
  base.style.transform=`translate(${V.x-R.x*k}px,${V.y-R.y*k}px) scale(${k})`;
}
function applyLive(){        // 手勢進行中：底圖用 CSS 即時縮放，筆跡向量即時重畫，停手後再清晰重繪
  setTransform();sched();updateUI();
  clearTimeout(settle);settle=setTimeout(render,140);
}
const sched=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;redraw()})};
function updateUI(){$('#pg').textContent=cur+' / '+total;$('#zl').textContent=Math.round(V.z*100)+'%'}

/* ---------- 渲染 ---------- */
async function render(){
  if(!total||!pw)return;
  const t=++token,d=dpr(),W=SW(),H=SH(),w=cw(),h=ch(),x=V.x,y=V.y;
  if(task){try{task.cancel()}catch(e){}task=null}
  off.width=Math.round(W*d);off.height=Math.round(H*d);
  octx.save();octx.shadowColor='#000a';octx.shadowBlur=24*d;octx.fillStyle='#fff';
  octx.fillRect(x*d,y*d,w*d,h*d);octx.restore();
  if(doc&&curPage){
    const vp=curPage.getViewport({scale:w/pw*d});
    task=curPage.render({canvasContext:octx,viewport:vp,transform:[1,0,0,1,x*d,y*d]});
    try{await task.promise}catch(e){return}
  }else if(imgs){
    octx.imageSmoothingQuality='high';octx.drawImage(imgs[cur-1],x*d,y*d,w*d,h*d);
  }
  if(t!==token)return;
  if(base.width!==off.width||base.height!==off.height){
    base.width=ink.width=laserC.width=off.width;base.height=ink.height=laserC.height=off.height;
  }
  bctx.clearRect(0,0,base.width,base.height);bctx.drawImage(off,0,0);
  R={w,x,y};setTransform();redraw();updateUI();
}

/* ---------- 筆跡 ---------- */
function redraw(){
  const d=dpr();
  ictx.setTransform(1,0,0,1,0,0);ictx.clearRect(0,0,ink.width,ink.height);
  ictx.setTransform(d,0,0,d,0,0);
  (strokes[cur]||[]).forEach(drawStroke);
}
function drawStroke(s){
  const w=cw(),h=ch(),X=u=>V.x+u*w,Y=v=>V.y+v*h,p=s.pts;if(!p.length)return;
  ictx.save();
  ictx.lineCap=ictx.lineJoin='round';ictx.lineWidth=s.w*w/1000;ictx.strokeStyle=s.c;
  if(s.t==='er')ictx.globalCompositeOperation='destination-out';
  if(s.t==='hl'){ictx.globalAlpha=.38;ictx.lineCap='butt'}
  ictx.beginPath();
  if(s.t==='line'){ictx.moveTo(X(p[0][0]),Y(p[0][1]));ictx.lineTo(X(p[1][0]),Y(p[1][1]))}
  else if(s.t==='rect'){ictx.rect(X(p[0][0]),Y(p[0][1]),(p[1][0]-p[0][0])*w,(p[1][1]-p[0][1])*h)}
  else if(s.t==='ell'){
    const cx=(X(p[0][0])+X(p[1][0]))/2,cy=(Y(p[0][1])+Y(p[1][1]))/2;
    ictx.ellipse(cx,cy,Math.abs(p[1][0]-p[0][0])*w/2,Math.abs(p[1][1]-p[0][1])*h/2,0,0,Math.PI*2);
  }else{
    ictx.moveTo(X(p[0][0]),Y(p[0][1]));
    if(p.length===1)ictx.lineTo(X(p[0][0])+.01,Y(p[0][1]));
    for(let i=1;i<p.length-1;i++)ictx.quadraticCurveTo(X(p[i][0]),Y(p[i][1]),X((p[i][0]+p[i+1][0])/2),Y((p[i][1]+p[i+1][1])/2));
    if(p.length>1){const l=p[p.length-1];ictx.lineTo(X(l[0]),Y(l[1]))}
  }
  ictx.stroke();ictx.restore();
}
const pt=e=>{const r=stage.getBoundingClientRect();return[(e.clientX-r.left-V.x)/cw(),(e.clientY-r.top-V.y)/ch()]};
const isShape=t=>t==='line'||t==='rect'||t==='ell';

function beginStroke(e){
  const q=pt(e),s={t:tool,c:color,w:W0[tool]*mult,pts:isShape(tool)?[q,q.slice()]:[q],id:e.pointerId,t0:performance.now()};
  (strokes[cur]=strokes[cur]||[]).push(s);drawing=s;sched();
}
function extendStroke(e){
  const s=drawing;
  if(!isShape(s.t)){
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[];
    for(const c of (evs.length?evs:[e]))s.pts.push(pt(c));
  }else{
    const q=pt(e),a=s.pts[0],w=cw(),h=ch();
    let dx=(q[0]-a[0])*w,dy=(q[1]-a[1])*h;const ax=Math.abs(dx),ay=Math.abs(dy);
    if(s.t==='line'){if(ay<ax*.06)dy=0;else if(ax<ay*.06)dx=0}
    else if(e.shiftKey||Math.abs(ax-ay)<.1*Math.max(ax,ay)){
      const m=Math.max(ax,ay);dx=(dx<0?-1:1)*m;dy=(dy<0?-1:1)*m;
    }
    s.pts[1]=[a[0]+dx/w,a[1]+dy/h];
  }
  sched();
}
function endStroke(){
  const s=drawing;drawing=null;if(!s)return;
  if(isShape(s.t)){
    const dx=(s.pts[1][0]-s.pts[0][0])*cw(),dy=(s.pts[1][1]-s.pts[0][1])*ch();
    if(Math.hypot(dx,dy)<4){const L=strokes[cur];L.splice(L.indexOf(s),1);sched()}
  }
}
function cancelStroke(){
  if(!drawing)return;const L=strokes[cur];L.splice(L.indexOf(drawing),1);drawing=null;sched();
}

/* ---------- 指標事件：筆／滑鼠寫字，手指平移縮放，雙指縮放 ---------- */
const P=new Map();let G=null;
const rel=(x,y)=>{const r=stage.getBoundingClientRect();return[x-r.left,y-r.top]};
ink.addEventListener('pointerdown',e=>{
  // 已經在寫字超過 0.35 秒時，後來才碰到螢幕的手掌或手指一律忽略，避免寫到一半被中斷
  if(drawing&&performance.now()-drawing.t0>350)return;
  ink.setPointerCapture(e.pointerId);
  P.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(P.size>=2){
    cancelStroke();
    const [a,b]=[...P.values()],m=rel((a.x+b.x)/2,(a.y+b.y)/2);
    G={k:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y)||1,z0:V.z,u:(m[0]-V.x)/cw(),v:(m[1]-V.y)/ch()};
    return;
  }
  if(tool==='laser'){lpush(e,true,true);return}
  if(tool==='pan'||(e.pointerType==='touch'&&!touchDraw)){
    G={k:'pan',id:e.pointerId,sx:e.clientX,sy:e.clientY,vx:V.x,vy:V.y};return;
  }
  if(e.button>0)return;
  beginStroke(e);
});
ink.addEventListener('pointermove',e=>{
  const p=P.get(e.pointerId);
  if(!p){if(tool==='laser'&&e.pointerType==='mouse')lpush(e,false,false);return}
  p.x=e.clientX;p.y=e.clientY;
  if(G&&G.k==='pinch'&&P.size>=2){
    const [a,b]=[...P.values()],m=rel((a.x+b.x)/2,(a.y+b.y)/2);
    V.z=Math.max(1,Math.min(8,G.z0*Math.hypot(a.x-b.x,a.y-b.y)/G.d0));
    V.x=m[0]-G.u*cw();V.y=m[1]-G.v*ch();clampV();applyLive();
  }else if(G&&G.k==='pan'&&G.id===e.pointerId){
    V.x=G.vx+e.clientX-G.sx;V.y=G.vy+e.clientY-G.sy;clampV();applyLive();
  }else if(tool==='laser')lpush(e,false,true);
  else if(drawing&&drawing.id===e.pointerId)extendStroke(e);
});
const up=e=>{
  P.delete(e.pointerId);
  if(G&&(G.k==='pinch'?P.size<2:G.id===e.pointerId))G=null;
  if(drawing&&drawing.id===e.pointerId)endStroke();
};
ink.addEventListener('pointerup',up);ink.addEventListener('pointercancel',up);
ink.addEventListener('contextmenu',e=>e.preventDefault());
ink.addEventListener('wheel',e=>{
  e.preventDefault();const [x,y]=rel(e.clientX,e.clientY);
  zoomAt(x,y,V.z*Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)));
},{passive:false});

/* ---------- 雷射筆：暫時性軌跡，數秒後自動淡出（不會存進頁面、也不能復原） ---------- */
const LASER_COLOR='#ff1f1f',LASER_LIFE=3000,LASER_W=7;   // 固定：紅色光暈、3 秒消失、粗細不受其他筆影響
let laser=[],lcur=null,lraf=0;
function lpush(e,fresh,held){
  const r=stage.getBoundingClientRect(),now=performance.now();
  if(fresh||!lcur||(!held&&now-lcur.pts[lcur.pts.length-1].t>150)){lcur={pts:[],c:LASER_COLOR};laser.push(lcur)}
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[];
  for(const c of (evs.length?evs:[e])){
    const x=c.clientX-r.left,y=c.clientY-r.top,l=lcur.pts[lcur.pts.length-1];
    if(l&&Math.hypot(x-l.x,y-l.y)<1.5)continue;
    lcur.pts.push({x,y,t:now});
  }
  if(!lcur.pts.length)lcur.pts.push({x:e.clientX-r.left,y:e.clientY-r.top,t:now});
  if(!lraf)lraf=requestAnimationFrame(ldraw);
}
function ldraw(){
  lraf=0;
  const d=dpr(),now=performance.now(),life=LASER_LIFE,bw=LASER_W;
  lctx.setTransform(1,0,0,1,0,0);lctx.clearRect(0,0,laserC.width,laserC.height);
  lctx.setTransform(d,0,0,d,0,0);lctx.lineCap=lctx.lineJoin='round';
  laser=laser.filter(s=>{s.pts=s.pts.filter(p=>now-p.t<life);return s.pts.length});
  if(lcur&&!laser.includes(lcur))lcur=null;
  for(const s of laser){
    const p=s.pts;
    for(let i=1;i<p.length;i++){
      const a=1-(now-p[i].t)/life,k=.35+.65*a;
      lctx.beginPath();lctx.moveTo(p[i-1].x,p[i-1].y);lctx.lineTo(p[i].x,p[i].y);
      lctx.strokeStyle=s.c;lctx.globalAlpha=a*.25;lctx.lineWidth=bw*2.6*k;lctx.stroke();
      lctx.globalAlpha=a*.9;lctx.lineWidth=bw*k;lctx.stroke();
      lctx.strokeStyle='#fff';lctx.globalAlpha=a*.75;lctx.lineWidth=bw*.3*k;lctx.stroke();
    }
    const l=p[p.length-1],a=1-(now-l.t)/life;
    lctx.globalAlpha=a*.3;lctx.fillStyle=s.c;lctx.beginPath();lctx.arc(l.x,l.y,bw*1.9,0,Math.PI*2);lctx.fill();
    lctx.globalAlpha=a;lctx.beginPath();lctx.arc(l.x,l.y,bw*.9,0,Math.PI*2);lctx.fill();
    lctx.fillStyle='#fff';lctx.beginPath();lctx.arc(l.x,l.y,bw*.35,0,Math.PI*2);lctx.fill();
  }
  lctx.globalAlpha=1;
  if(laser.length)lraf=requestAnimationFrame(ldraw);
}

/* ---------- 工具列 ---------- */
function setTool(t){
  tool=t;document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  ink.style.cursor=t==='pan'?'grab':'crosshair';
}
const undo=()=>{(strokes[cur]||[]).pop();sched()};
const clearPage=()=>{strokes[cur]=[];sched()};
const toggleFull=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
const zoomBtn=f=>zoomAt(SW()/2,SH()/2,V.z*f);
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>setTool(b.dataset.t));
document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{
  color=b.dataset.c;document.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===b));
  if(tool==='er'||tool==='pan')setTool('pen');
});
$('#mult').onchange=e=>mult=+e.target.value;
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
$('#undo').onclick=undo;$('#clear').onclick=clearPage;$('#full').onclick=toggleFull;
$('#zin').onclick=()=>zoomBtn(1.4);$('#zout').onclick=()=>zoomBtn(1/1.4);
$('#zl').onclick=()=>zoomAt(SW()/2,SH()/2,1);
$('#td').onclick=e=>{touchDraw=!touchDraw;e.currentTarget.classList.toggle('on',touchDraw)};
$('#file').onchange=e=>{openFiles(e.target.files);e.target.value=''};

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT')return;
  const k=e.key,K=k.toLowerCase();
  if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();go(cur+1)}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();go(cur-1)}
  else if((e.ctrlKey||e.metaKey)&&K==='z'){e.preventDefault();undo()}
  else if(e.ctrlKey||e.metaKey||e.altKey)return;
  else if(k==='Delete')clearPage();
  else if(k==='+'||k==='=')zoomBtn(1.4);
  else if(k==='-')zoomBtn(1/1.4);
  else if(k==='0')zoomAt(SW()/2,SH()/2,1);
  else{const m={p:'pen',h:'hl',l:'line',r:'rect',o:'ell',e:'er',b:'laser',v:'pan'};if(m[K])setTool(m[K]);else if(K==='f')toggleFull()}
});

/* 全螢幕：工具列自動收起，右下角 ☰ 可叫回 */
let bt;
function showBar(){
  document.body.classList.remove('bi');clearTimeout(bt);
  if(document.fullscreenElement)bt=setTimeout(()=>document.body.classList.add('bi'),5000);
}
$('#bar').addEventListener('pointerdown',showBar);$('#bar').addEventListener('pointermove',showBar);
$('#fab').onclick=showBar;
document.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'&&document.fullscreenElement&&e.clientY>innerHeight-90)showBar();
});
document.addEventListener('fullscreenchange',()=>{
  document.body.classList.toggle('fs',!!document.fullscreenElement);showBar();
  setTimeout(()=>{if(pw){clampV();render()}},120);
});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(pw){clampV();render()}},120)});

const dz=$('#drop');
window.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over')});
window.addEventListener('dragleave',()=>dz.classList.remove('over'));
window.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('over');openFiles(e.dataTransfer.files)});
setTool('pen');
</script>
</body>
</html>
